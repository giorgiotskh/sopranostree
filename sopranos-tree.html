// ─── COLORS & STATUS ─────────────────────────────────────────────────────

const STATUS_COLOR = {
  'Alive': '#5a9a6a',
  'Dead': '#8a4a4a',
  'Imprisoned': '#7a7a3a',
  'Comatose': '#4a4a8a',
  'Unresolved': '#c8a96e',
};
function statusColor(s) {
  for(const [k,v] of Object.entries(STATUS_COLOR)) {
    if(s && s.toLowerCase().includes(k.toLowerCase())) return v;
  }
  return '#666';
}

// ─── PORTRAIT GENERATOR ──────────────────────────────────────────────────
function drawPortrait(canvas, color, name, status) {
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0,0,w,h);
  // dark bg
  ctx.fillStyle = '#111';
  ctx.fillRect(0,0,w,h);
  // silhouette
  const sc = status && status.toLowerCase().includes('dead') ? '#333' : color + '33';
  // head
  ctx.beginPath();
  ctx.arc(w/2, h*0.32, w*0.28, 0, Math.PI*2);
  ctx.fillStyle = sc;
  ctx.fill();
  // body
  ctx.beginPath();
  ctx.ellipse(w/2, h*0.78, w*0.38, h*0.28, 0, 0, Math.PI*2);
  ctx.fillStyle = sc;
  ctx.fill();
  // color accent top
  ctx.fillStyle = color;
  ctx.fillRect(0,0,w,3);
  // initials
  const parts = name.split(' ');
  const init = parts.map(p=>p[0]).join('').slice(0,2);
  ctx.fillStyle = color;
  ctx.font = `bold ${w*0.3}px Cinzel, serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(init, w/2, h*0.35);
  // dead overlay
  if(status && status.toLowerCase().includes('dead')) {
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.fillRect(0,0,w,h);
    ctx.strokeStyle = '#8a4a4a';
    ctx.lineWidth = 1;
    ctx.beginPath();ctx.moveTo(4,4);ctx.lineTo(w-4,h-4);ctx.stroke();
    ctx.beginPath();ctx.moveTo(w-4,4);ctx.lineTo(4,h-4);ctx.stroke();
  }
}

// ─── SVG TREE BUILDER ────────────────────────────────────────────────────
const SVG_NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('main-svg');
const labelsEl = document.getElementById('family-labels');
const legendEl = document.getElementById('legend');

// Responsive sizing
function getW() { return Math.max(window.innerWidth, FAMILIES.length * 160); }
const ROW_H = window.innerHeight > 700 ? Math.min(window.innerHeight * 0.82, 780) : 620;

function colX(i, total, svgW) {
  const pad = Math.max(svgW * 0.05, 70);
  const avail = svgW - pad*2;
  return pad + (i / (total-1)) * avail;
}

// Organic bezier branch: from (x1,y1) to (x2,y2) with slight waviness
function branchPath(x1,y1,x2,y2, waveAmp=0) {
  const midX = (x1+x2)/2 + (Math.random()-0.5)*waveAmp;
  const midY = (y1+y2)/2 + (Math.random()-0.5)*(waveAmp*0.5);
  return `M${x1},${y1} Q${midX},${midY} ${x2},${y2}`;
}

function buildTree(family, colCenterX, svgW, svgH) {
  const color = family.color;
  const members = family.members;
  const g = document.createElementNS(SVG_NS,'g');
  g.setAttribute('data-family', family.name);

  const rootY = 60;
  const leafZone = svgH - 80;
  const leafCount = members.length;

  // Root point (top center of column)
  const rootX = colCenterX;

  // Spread leaves horizontally in column
  const colW = svgW / FAMILIES.length * 0.88;
  const half = colW / 2;

  // Generate leaf positions — spread them out vertically too for organic look
  // Boss/founder near top, members cascade down
  const leaves = members.map((m,i) => {
    const t = leafCount === 1 ? 0.5 : i/(leafCount-1);
    const rawX = colCenterX - half + t * colW + (Math.sin(i*2.3)*8);
    const x = Math.min(Math.max(rawX, 24), svgW - 24);
    const yBase = rootY + (leafZone - rootY) * 0.25 + (leafZone - rootY) * 0.75 * (i/(Math.max(leafCount-1,1)));
    const y = yBase + (Math.sin(i*1.7)*12);
    return {x,y,member:m};
  });

  // Main trunk from root down to ~40% height
  const trunkEndY = rootY + (leafZone - rootY) * 0.18;
  const trunk1EndY = rootY + (leafZone - rootY) * 0.38;

  // Draw trunk
  const trunkPath = document.createElementNS(SVG_NS,'path');
  const tw = leafCount > 8 ? 4 : leafCount > 3 ? 3 : 2;
  trunkPath.setAttribute('d', `M${rootX},${rootY} C${rootX+(Math.random()-0.5)*20},${rootY+(trunkEndY-rootY)*0.4} ${rootX+(Math.random()-0.5)*15},${trunk1EndY*0.8} ${rootX+(Math.random()-0.5)*10},${trunk1EndY}`);
  trunkPath.setAttribute('stroke', color);
  trunkPath.setAttribute('stroke-width', tw);
  trunkPath.setAttribute('fill', 'none');
  trunkPath.setAttribute('stroke-linecap','round');
  trunkPath.classList.add('tree-line');
  trunkPath.dataset.familyName = family.name + ' (' + family.sub + ')';
  trunkPath.dataset.familyColor = color;
  g.appendChild(trunkPath);

  // Distribute leaves into 2-3 main branches
  const branchCount = leafCount <= 2 ? 1 : leafCount <= 5 ? 2 : 3;
  const groups = Array.from({length:branchCount}, () => []);
  leaves.forEach((l,i) => groups[i % branchCount].push(l));

  groups.forEach((grp, gi) => {
    if(!grp.length) return;
    const t = branchCount === 1 ? 0.5 : gi/(branchCount-1);
    const bx = Math.min(Math.max(colCenterX - half*0.7 + t * (colW*0.7) + (Math.random()-0.5)*8, 24), svgW - 24);
    const by = trunk1EndY + (leafZone - trunk1EndY) * (0.12 + gi*0.05);

    // Branch from trunk to branch point
    const bp = document.createElementNS(SVG_NS,'path');
    bp.setAttribute('d', branchPath(rootX+(Math.random()-0.5)*10, trunk1EndY, bx, by, 12));
    bp.setAttribute('stroke', color);
    bp.setAttribute('stroke-width', Math.max(tw-1,1.5));
    bp.setAttribute('fill','none');
    bp.setAttribute('stroke-linecap','round');
    bp.classList.add('tree-line');
    bp.dataset.familyName = family.name + ' (' + family.sub + ')';
    bp.dataset.familyColor = color;
    g.appendChild(bp);

    // Sub-branches to each leaf
    grp.forEach((leaf, li) => {
      // possibly add mid-branch for long groups
      let sx = bx, sy = by;
      if(grp.length > 3) {
        const t2 = li/(grp.length-1);
        const sbx = bx - (colW*0.25) + t2*(colW*0.5);
        const sby = by + (leaf.y - by)*0.45 + (Math.random()-0.5)*8;
        const sp = document.createElementNS(SVG_NS,'path');
        sp.setAttribute('d', branchPath(bx,by,sbx,sby,8));
        sp.setAttribute('stroke',color);
        sp.setAttribute('stroke-width',Math.max(tw-1.5,1));
        sp.setAttribute('fill','none');
        sp.setAttribute('stroke-linecap','round');
        sp.classList.add('tree-line');
        sp.dataset.familyName = family.name + ' (' + family.sub + ')';
        sp.dataset.familyColor = color;
        g.appendChild(sp);
        sx=sbx; sy=sby;
      }
      const lp = document.createElementNS(SVG_NS,'path');
      lp.setAttribute('d', branchPath(sx,sy,leaf.x,leaf.y, 6));
      lp.setAttribute('stroke',color);
      lp.setAttribute('stroke-width',1.2);
      lp.setAttribute('fill','none');
      lp.setAttribute('stroke-linecap','round');
      lp.classList.add('tree-line');
      lp.dataset.familyName = family.name + ' (' + family.sub + ')';
      lp.dataset.familyColor = color;
      g.appendChild(lp);

      // Leaf dot (endpoint)
      const dot = document.createElementNS(SVG_NS,'circle');
      dot.setAttribute('cx', leaf.x);
      dot.setAttribute('cy', leaf.y);
      dot.setAttribute('r', 7);
      dot.setAttribute('fill', '#0a0a0b');
      dot.setAttribute('stroke', color);
      dot.setAttribute('stroke-width', 2);
      dot.style.cursor = 'pointer';
      dot.classList.add('leaf-dot');
      dot.dataset.memberId = leaf.member.id;

      // Pulse ring
      const pulse = document.createElementNS(SVG_NS,'circle');
      pulse.setAttribute('cx', leaf.x);
      pulse.setAttribute('cy', leaf.y);
      pulse.setAttribute('r', 10);
      pulse.setAttribute('fill','none');
      pulse.setAttribute('stroke', color);
      pulse.setAttribute('stroke-width','1');
      pulse.setAttribute('opacity','0.3');
      pulse.style.pointerEvents = 'none';
      g.appendChild(pulse);
      g.appendChild(dot);
    });
  });

  // Root dot
  const rootDot = document.createElementNS(SVG_NS,'circle');
  rootDot.setAttribute('cx',rootX);
  rootDot.setAttribute('cy',rootY);
  rootDot.setAttribute('r',5);
  rootDot.setAttribute('fill',color);
  rootDot.setAttribute('opacity','0.6');
  g.appendChild(rootDot);

  // Family label at root
  const lbl = document.createElementNS(SVG_NS,'text');
  lbl.setAttribute('x',rootX);
  lbl.setAttribute('y',rootY - 14);
  lbl.setAttribute('text-anchor','middle');
  lbl.setAttribute('fill',color);
  lbl.setAttribute('font-size','10');
  lbl.setAttribute('font-family','Cinzel,serif');
  lbl.setAttribute('letter-spacing','1.5');
  lbl.textContent = family.name.toUpperCase();
  g.appendChild(lbl);

  return g;
}

function render() {
  const svgW = getW();
  const svgH = ROW_H;
  svg.setAttribute('viewBox', `0 0 ${svgW} ${svgH}`);
  svg.setAttribute('height', svgH);
  svg.innerHTML = '';

  // Build family column centers
  const centers = FAMILIES.map((_,i) => colX(i, FAMILIES.length, svgW));

  FAMILIES.forEach((fam,i) => {
    const g = buildTree(fam, centers[i], svgW, svgH);
    svg.appendChild(g);
  });

  // Labels bar
  labelsEl.innerHTML = '';
  FAMILIES.forEach(fam => {
    const d = document.createElement('div');
    d.className = 'fam-label';
    d.style.color = fam.color;
    d.style.borderBottomColor = fam.color;
    d.textContent = fam.name;
    labelsEl.appendChild(d);
  });

  // Legend
  legendEl.innerHTML = '';
  FAMILIES.forEach(fam => {
    const li = document.createElement('div');
    li.className = 'leg-item';
    li.innerHTML = `<div class="leg-dot" style="background:${fam.color}"></div>${fam.name} (${fam.sub})`;
    legendEl.appendChild(li);
  });

  attachEvents();
}

// ─── EVENTS ──────────────────────────────────────────────────────────────
const memberMap = {};
FAMILIES.forEach(fam => {
  fam.members.forEach(m => { memberMap[m.id] = {member:m, family:fam}; });
});

const lineTip = document.getElementById('line-tip');

function attachEvents() {
  // Leaf dots
  document.querySelectorAll('.leaf-dot').forEach(dot => {
    dot.addEventListener('click', e => {
      e.stopPropagation();
      const id = dot.dataset.memberId;
      const entry = memberMap[id];
      if(entry) openPopup(entry.member, entry.family);
    });
    dot.addEventListener('mouseenter', e => {
      const id = dot.dataset.memberId;
      const entry = memberMap[id];
      if(entry) {
        dot.setAttribute('r','9');
        dot.setAttribute('stroke-width','2.5');
        lineTip.textContent = entry.member.name + (entry.member.nick ? ' ' + entry.member.nick : '');
        lineTip.style.display = 'block';
        lineTip.style.color = entry.family.color;
        lineTip.style.borderColor = entry.family.color + '44';
      }
    });
    dot.addEventListener('mousemove', e => {
      lineTip.style.left = (e.clientX+12)+'px';
      lineTip.style.top = (e.clientY-28)+'px';
    });
    dot.addEventListener('mouseleave', () => {
      dot.setAttribute('r','7');
      dot.setAttribute('stroke-width','2');
      lineTip.style.display='none';
    });
  });

  // Lines
  document.querySelectorAll('.tree-line').forEach(line => {
    line.addEventListener('click', e => {
      e.stopPropagation();
      const fname = line.dataset.familyName;
      const fc = line.dataset.familyColor;
      lineTip.textContent = fname;
      lineTip.style.color = fc;
      lineTip.style.borderColor = fc+'44';
      lineTip.style.display = 'block';
      lineTip.style.left = (e.clientX+12)+'px';
      lineTip.style.top = (e.clientY-28)+'px';
      setTimeout(()=>{lineTip.style.display='none';},2000);
    });
    line.addEventListener('mouseenter', e => {
      line.setAttribute('stroke-opacity','0.55');
      const fname = line.dataset.familyName;
      const fc = line.dataset.familyColor;
      lineTip.textContent = fname;
      lineTip.style.color = fc;
      lineTip.style.borderColor = fc+'44';
      lineTip.style.display = 'block';
    });
    line.addEventListener('mousemove', e => {
      lineTip.style.left = (e.clientX+12)+'px';
      lineTip.style.top = (e.clientY-28)+'px';
    });
    line.addEventListener('mouseleave', () => {
      line.setAttribute('stroke-opacity','1');
      lineTip.style.display='none';
    });
  });
}

function openPopup(member, family) {
  const popup = document.getElementById('popup');
  const overlay = document.getElementById('overlay');
  document.getElementById('popup-accent').style.background = family.color;
  document.getElementById('popup-name').textContent = member.name;
  document.getElementById('popup-nick').textContent = member.nick || '';
  const badge = document.getElementById('popup-family-badge');
  badge.textContent = family.name + ' — ' + family.sub;
  badge.style.color = family.color;
  badge.style.borderColor = family.color + '66';
  document.getElementById('popup-role').textContent = member.role;
  const sc = statusColor(member.status);
  document.getElementById('popup-status').innerHTML = `<span style="color:${sc};font-size:10px;letter-spacing:0.08em">◉ ${member.status}</span>`;
  document.getElementById('popup-desc').textContent = member.desc;

  // Draw portrait
  const canvas = document.getElementById('popup-portrait');
  (function(cv, fam, mem) {
    var pel = document.getElementById('ph-' + mem.id);
    function _draw(imgEl) {
      var ctx2 = cv.getContext('2d');
      ctx2.clearRect(0,0,cv.width,cv.height);
      var cw2=cv.width, ch2=cv.height;
      var sc2=Math.max(cw2/imgEl.naturalWidth, ch2/imgEl.naturalHeight);
      ctx2.drawImage(imgEl,(cw2-imgEl.naturalWidth*sc2)/2,(ch2-imgEl.naturalHeight*sc2)/2,imgEl.naturalWidth*sc2,imgEl.naturalHeight*sc2);
      ctx2.fillStyle=fam.color; ctx2.fillRect(0,0,cw2,3);
      if(mem.status&&mem.status.toLowerCase().indexOf('dead')>-1){
        ctx2.fillStyle='rgba(0,0,0,0.45)'; ctx2.fillRect(0,0,cw2,ch2);
        ctx2.strokeStyle='#c0392b'; ctx2.lineWidth=2;
        ctx2.beginPath();ctx2.moveTo(3,3);ctx2.lineTo(cw2-3,ch2-3);ctx2.stroke();
        ctx2.beginPath();ctx2.moveTo(cw2-3,3);ctx2.lineTo(3,ch2-3);ctx2.stroke();
      }
    }
    if (pel) {
      if (pel.complete && pel.naturalWidth) { _draw(pel); }
      else { pel.onload = function(){ _draw(pel); }; drawPortrait(cv, fam.color, mem.name, mem.status); }
    } else {
      drawPortrait(cv, fam.color, mem.name, mem.status);
    }
  })(canvas, family, member);

  overlay.classList.add('visible');
  popup.style.display = 'block';
  requestAnimationFrame(() => popup.classList.add('visible'));
}

function closePopup() {
  const popup = document.getElementById('popup');
  popup.classList.remove('visible');
  document.getElementById('overlay').classList.remove('visible');
  setTimeout(()=>{ popup.style.display='none'; }, 200);
}

document.addEventListener('keydown', e => { if(e.key==='Escape') closePopup(); });

// ─── INIT ────────────────────────────────────────────────────────────────
render();
window.addEventListener('resize', () => { render(); });
</script>
